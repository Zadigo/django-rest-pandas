[project]
name = "django-rest-pandas"
version = "0.1.0"
requires-python = ">=3.14"
authors = [
    {name = "S. Andrew Sheppard", email = "andrew@wq.io"},
    {name = "John Pendenque", email = "pendenquejohn@gmail.com"},
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Programming Language :: JavaScript",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Framework :: Django",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 6.0",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "djangorestframework>=3.17.1",
    "matplotlib>=3.11.1",
    "pandas>=3.0.5",
]

[dependency-groups]
dev = [
    "autopep8>=2.3.2",
    "coverage>=7.13.4",
    "django-browser-reload>=1.21.0",
    "django-watchfiles>=1.4.0",
    "factory-boy>=3.3.3",
    "pytest>=9.0.3",
    "pytest-aio>=2.1.7",
    "pytest-celery>=1.3.0",
    "pytest-cov>=7.1.0",
    "pytest-datafiles>=3.0.1",
    "pytest-django>=4.12.0",
    "pytest-env>=1.6.0",
    "pytest-playwright>=0.7.2",
    "pytest-reportlog>=1.0.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.15.16",
]

[tool.pyright]
typeCheckingMode = "off"
reportMissingImports = true
reportUntypedBaseClass = true

[tool.pytest]
timeout="5000"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "api: marks tests as api tests",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool.pytest.ini_options]

[tool.pytest_env]
env_files = [".env", ".env.test"]


[tool.autopep8]
max_line_length = 120
# ignore = "E501,W6"  # or ["E501", "W6"]
in-place = true
recursive = true
aggressive = 3

[project.urls]
Homepage = "https://django-rest-pandas.wq.io/"
Documentation = "https://django-rest-pandas.wq.io/"
Source = "https://github.com/wq/django-rest-pandas"
"Release Notes" = "https://django-rest-pandas.wq.io/releases/"
Issues = "https://github.com/wq/django-rest-pandas/issues"
CI = "https://github.com/wq/django-rest-pandas/actions/workflows/test.yml"
